<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KBO TICKET | 프로야구 실시간 좌석 예매 포털</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    :root {
      --primary: #0f2544;
      --accent: #d91e36;
      --accent-hover: #b5152a;
      --selected: #2563eb;
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --border: #e2e8f0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, input, select, button {
      font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    header {
      background: #09182e;
      color: #fff;
      padding: 16px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .header-inner {
      max-width: 1140px;
      margin: 0 auto;
      padding: 0 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: #fff;
    }
    .brand-badge {
      background: var(--accent);
      color: #fff;
      font-size: 12px;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 20px;
    }
    .brand h1 {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .nav-links {
      display: flex;
      gap: 10px;
    }
    .nav-btn {
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      text-decoration: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      transition: background 0.15s;
    }
    .nav-btn:hover { background: rgba(255, 255, 255, 0.22); }
    .nav-btn.primary { background: var(--accent); }
    .nav-btn.primary:hover { background: var(--accent-hover); }

    /* 히어로 섹션 */
    .hero {
      background: linear-gradient(135deg, #09182e 0%, #163663 60%, #1e40af 100%);
      color: #fff;
      padding: 52px 20px 64px;
      text-align: center;
    }
    .hero-inner {
      max-width: 820px;
      margin: 0 auto;
    }
    .hero-tag {
      display: inline-block;
      background: rgba(255, 255, 255, 0.15);
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 14px;
    }
    .hero h2 {
      font-size: 34px;
      font-weight: 800;
      letter-spacing: -0.8px;
      margin-bottom: 12px;
    }
    .hero p {
      font-size: 16px;
      color: #cbd5e1;
      margin-bottom: 28px;
    }

    /* 빠른 경기 검색 바 */
    .quick-search-box {
      background: #fff;
      border-radius: 14px;
      padding: 18px;
      display: grid;
      grid-template-columns: 1fr 1.3fr auto;
      gap: 12px;
      align-items: end;
      box-shadow: 0 14px 30px rgba(0, 0, 0, 0.25);
      text-align: left;
    }
    @media (max-width: 720px) {
      .quick-search-box { grid-template-columns: 1fr; }
      .hero h2 { font-size: 26px; }
    }
    .search-field label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 5px;
    }
    .search-field input, .search-field select {
      width: 100%;
      padding: 11px 12px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      background: #f8fafc;
    }
    .search-submit {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      height: 44px;
      white-space: nowrap;
    }
    .search-submit:hover { background: var(--accent-hover); }

    /* 전국 9개 야구장 그리드 섹션 */
    .main-section {
      max-width: 1140px;
      margin: 36px auto 60px;
      padding: 0 20px;
    }
    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .section-head h3 {
      font-size: 22px;
      font-weight: 800;
      color: var(--primary);
      letter-spacing: -0.4px;
    }
    .section-head span {
      font-size: 13px;
      color: var(--muted);
      font-weight: 600;
    }

    .stadium-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }
    @media (max-width: 900px) {
      .stadium-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 580px) {
      .stadium-grid { grid-template-columns: 1fr; }
    }

    .stadium-card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .stadium-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 22px rgba(15, 23, 42, 0.1);
      border-color: #93c5fd;
    }
    .team-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 800;
      padding: 3px 9px;
      border-radius: 5px;
      background: #eff6ff;
      color: #1d4ed8;
      margin-bottom: 8px;
    }
    .stadium-card h4 {
      font-size: 18px;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 6px;
    }
    .stadium-card p {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 16px;
    }
    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 12px;
      border-top: 1px solid #f1f5f9;
    }
    .open-count {
      font-size: 12px;
      font-weight: 700;
      color: #15803d;
    }
    .open-count.none { color: #94a3b8; }
    .go-btn {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 7px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    .go-btn:hover { background: #1e3a6e; }
  </style>
</head>
<body>

  <header>
    <div class="header-inner">
      <a href="/index.html" class="brand">
        <span class="brand-badge">KBO TICKET</span>
        <h1>⚾ 프로야구 공식 실시간 예매 포털</h1>
      </a>
      <div class="nav-links">
        <a href="/booking.html#lookup" class="nav-btn">내 티켓 조회 / 취소</a>
        <a href="/booking.html" class="nav-btn primary">전체 예매 · 구역 오픈 →</a>
      </div>
    </div>
  </header>

  <section class="hero">
    <div class="hero-inner">
      <span class="hero-tag">2026 KBO LEAGUE REAL-TIME TICKETING</span>
      <h2>원하는 날짜와 구장을 선택하고 실시간 선착순 예매하세요</h2>
      <p>구장별 좌석 시야 사진 확인부터 다중 좌석 배치도 선택, 비회원 보안 인증번호 발급까지 한 번에 진행됩니다.</p>

      <div class="quick-search-box">
        <div class="search-field">
          <label>📅 관람 희망 날짜</label>
          <input type="date" id="mainDateInput" />
        </div>
        <div class="search-field">
          <label>🏟️ 프로야구장 선택</label>
          <select id="mainStadiumSelect">
            <option value="ALL">전체 야구장 경기 보기</option>
            <option value="잠실야구장">서울 잠실야구장 (LG 트윈스 / 두산 베어스)</option>
            <option value="고척스카이돔">서울 고척스카이돔 (키움 히어로즈)</option>
            <option value="인천 SSG랜더스필드">인천 SSG랜더스필드 (SSG 랜더스)</option>
            <option value="수원 KT위즈파크">수원 KT위즈파크 (KT 위즈)</option>
            <option value="대전 한화생명 볼파크">대전 한화생명 볼파크 (한화 이글스)</option>
            <option value="대구 삼성라이온즈파크">대구 삼성라이온즈파크 (삼성 라이온즈)</option>
            <option value="광주-기아 챔피언스필드">광주-기아 챔피언스필드 (KIA 타이거즈)</option>
            <option value="부산 사직야구장">부산 사직야구장 (롯데 자이언츠)</option>
            <option value="창원 NC파크">창원 NC파크 (NC 다이노스)</option>
          </select>
        </div>
        <button type="button" class="search-submit" onclick="goToBookingWithFilter()">좌석 예매하기 →</button>
      </div>
    </div>
  </section>

  <main class="main-section">
    <div class="section-head">
      <div>
        <h3>🏟️ 전국 KBO 프로야구장 바로가기</h3>
        <span>구장을 클릭하면 해당 야구장의 예매 및 좌석 오픈 화면으로 바로 이동합니다.</span>
      </div>
      <a href="/booking.html#open-section" style="font-size:14px; font-weight:700; color:#2563eb; text-decoration:none;">+ 새 경기 및 좌석 구역 직접 오픈하기 ↗</a>
    </div>

    <div class="stadium-grid" id="stadiumCards"></div>
  </main>

  <script>
    const STADIUM_LIST = [
      { key: "jamsil", name: "잠실야구장", teams: "LG 트윈스 · 두산 베어스", desc: "네이비석, 블루석, 오렌지 응원석, 중앙 테이블석 등" },
      { key: "gocheok", name: "고척스카이돔", teams: "키움 히어로즈", desc: "버건디석, 다크버건디석, 로열다이아몬드 클럽 등" },
      { key: "munhak", name: "인천 SSG랜더스필드", teams: "SSG 랜더스", desc: "으쓱이존 응원석, 프렌들리존, 이마트 바비큐존 등" },
      { key: "suwon", name: "수원 KT위즈파크", teams: "KT 위즈", desc: "1루 응원지정석, 하이파이브존, 지니존 테이블석 등" },
      { key: "daejeon", name: "대전 한화생명 볼파크", teams: "한화 이글스", desc: "1루 내야지정석, 중앙 탁자석, 인피니티풀 특화석 등" },
      { key: "daegu", name: "대구 삼성라이온즈파크", teams: "삼성 라이온즈", desc: "블루존 응원석, VIP 테이블석, 스윗박스 등" },
      { key: "gwangju", name: "광주-기아 챔피언스필드", teams: "KIA 타이거즈", desc: "K9석, 챔피언석, 타이거즈 가족석, 서프라이즈존 등" },
      { key: "sajik", name: "부산 사직야구장", teams: "롯데 자이언츠", desc: "내야상단 응원석, 중앙탁자석, 익사이팅존 등" },
      { key: "changwon", name: "창원 NC파크", teams: "NC 다이노스", desc: "1루 내야응원석, 프리미엄 테이블석, 가족석 등" }
    ];

    function goToBookingWithFilter(stadiumName = null, stadiumKey = null) {
      const dateVal = document.getElementById("mainDateInput").value;
      const selectedStadium = stadiumName || document.getElementById("mainStadiumSelect").value;
      const params = new URLSearchParams();
      if (dateVal) params.set("date", dateVal);
      if (selectedStadium && selectedStadium !== "ALL") params.set("stadium", selectedStadium);
      if (stadiumKey) params.set("preset", stadiumKey);
      window.location.href = `/booking.html?${params.toString()}`;
    }

    async function renderStadiumCards() {
      let sections = [];
      try {
        const res = await fetch("/api/sections");
        sections = await res.json();
      } catch (e) {}

      const grid = document.getElementById("stadiumCards");
      grid.innerHTML = STADIUM_LIST.map(st => {
        const matchedCount = sections.filter(s => (s.stadium || "") === st.name || s.title.includes(st.name)).length;
        return `
          <div class="stadium-card">
            <div>
              <span class="team-badge">${st.teams}</span>
              <h4>${st.name}</h4>
              <p>${st.desc}</p>
            </div>
            <div class="card-footer">
              <span class="open-count ${matchedCount === 0 ? 'none' : ''}">
                ${matchedCount > 0 ? `● 현재 ${matchedCount}개 구역 오픈 중` : '예매 가능 구역 오픈 대기'}
              </span>
              <button type="button" class="go-btn" onclick="goToBookingWithFilter('${st.name}', '${st.key}')">입장하기 →</button>
            </div>
          </div>
        `;
      }).join("");
    }

    renderStadiumCards();
  </script>
</body>
</html>
